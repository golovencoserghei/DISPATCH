<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root { color-scheme: light dark; }
    body { width: 320px; margin: 0; padding: 12px 14px; font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #b33; }
    .dot.on { background: #2c8a3d; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    .muted { opacity: 0.65; font-size: 12px; }
    button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid #8886; background: #7773; cursor: pointer; }
    button:hover { background: #7775; }
    .granted { margin: 4px 0; }
    .granted .tab { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
    .granted .tab:hover { background: #7772; }
    .granted .tab.current { font-weight: 600; }
    .granted .mark { width: 14px; text-align: center; color: #2c8a3d; }
    .granted .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .granted .x { padding: 0 6px; line-height: 1.2; }
    textarea { width: 100%; box-sizing: border-box; height: 48px; resize: vertical; font: 12px monospace; }
    input[type=number] { width: 70px; }
    hr { border: none; border-top: 1px solid #8884; margin: 10px 0; }
    .log { background: #7772; border-radius: 6px; padding: 6px 8px; max-height: 130px; overflow: auto; font: 11px/1.5 monospace; white-space: pre-wrap; }
    label.sw { position: relative; display: inline-block; width: 40px; height: 22px; }
    label.sw input { display: none; }
    .slider { position: absolute; inset: 0; background: #9994; border-radius: 22px; transition: .2s; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #2c8a3d; }
    input:checked + .slider::before { transform: translateX(18px); }
  </style>
</head>
<body>
  <h1><span id="dot" class="dot"></span> Dispatch</h1>

  <div class="row">
    <span data-i18n="masterSwitch"></span>
    <label class="sw"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
  </div>
  <div class="row muted"><span id="conn"></span></div>
  <div class="row">
    <span data-i18n="accessMode"></span>
    <select id="mode">
      <option value="full" data-i18n="modeFull"></option>
      <option value="readonly" data-i18n="modeReadonly"></option>
    </select>
  </div>
  <div class="muted" style="font-size:11px" data-i18n="modeHint"></div>

  <hr />

  <div class="row">
    <span data-i18n="grantedTabs"></span>
    <button id="revokeAccess" data-i18n="revokeAll" data-i18n-title="revokeAllTitle"></button>
  </div>
  <div class="granted" id="granted"></div>
  <div class="muted" style="font-size:11px" data-i18n="grantedHint"></div>
  <div class="row"><button id="grant" data-i18n="grantBtn"></button></div>

  <hr />

  <div class="row"><span data-i18n="serverPort"></span><input type="number" id="port" min="1" max="65535" /></div>
  <div class="row"><span data-i18n="token"></span><input type="password" id="token" data-i18n-placeholder="tokenPlaceholder" style="width:150px" /></div>
  <div class="muted" data-i18n="allowlistLabel"></div>
  <textarea id="allowlist" placeholder="example.com&#10;*.mydomain.dev"></textarea>
  <div class="row"><button id="reconnect" data-i18n="reconnect"></button></div>

  <hr />
  <div class="row">
    <span id="dbg" class="muted"></span>
    <button id="stopdbg" style="display:none" data-i18n="stopDebug"></button>
  </div>

  <hr />
  <div class="muted" data-i18n="log"></div>
  <div class="log" id="log"></div>

  <script src="popup.js"></script>
</body>
</html>
